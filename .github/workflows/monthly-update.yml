name: Monthly Data Refresh

on:
  schedule:
    - cron: "0 9 1 * *" # 1st of each month, 9am UTC
  workflow_dispatch: # Allow manual trigger

# One Notion-writing job at a time across every workflow in this repo: the jobs
# share one Notion integration's rate limit and each can fire the deploy hook.
# Queue, never cancel, so an in-flight sync always finishes its writes.
concurrency:
  group: notion-writes
  cancel-in-progress: false

jobs:
  refresh:
    # Pinned: ubuntu-latest moved to 26.04 on 6 Nov 2026 and Playwright has no
    # Chromium build for it ("Playwright does not support chromium on ubuntu26.04-x64").
    # Move back to ubuntu-latest once Playwright supports 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # the directory-health step opens/closes its issue
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SCHOOLS_DB: ${{ secrets.NOTION_SCHOOLS_DB }}
      NOTION_DIRECTORY_DB: ${{ secrets.NOTION_DIRECTORY_DB }}
      NOTION_STATES_DB: ${{ secrets.NOTION_STATES_DB }}
      NOTION_PRICING_DB: ${{ secrets.NOTION_PRICING_DB }}
      NOTION_SCRAPER_RULES_DB: ${{ secrets.NOTION_SCRAPER_RULES_DB }}
      NOTION_FAQ_DB_ID: ${{ secrets.NOTION_FAQ_DB_ID }}
      NOTION_STATE_REQUIREMENTS_DB: ${{ secrets.NOTION_STATE_REQUIREMENTS_DB }}
      NOTION_SCHOOL_VARIANTS_DB: ${{ secrets.NOTION_SCHOOL_VARIANTS_DB }}
      NOTION_ISSUES_DB: ${{ secrets.NOTION_ISSUES_DB }}
      # One JSON line per state sync (scripts/lib/scraper-utils), read by the health report.
      DIRECTORY_SCRAPE_SUMMARY: directory-scrape-summary.jsonl
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify required secrets are set
        run: |
          missing=()
          for v in NOTION_TOKEN NOTION_SCHOOLS_DB NOTION_DIRECTORY_DB NOTION_PRICING_DB GOOGLE_PLACES_API_KEY; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape state DMV sources → Notion Directory
        # Individual DMV sites go down intermittently (ECONNREFUSED/timeouts).
        # scrape:dmv now runs each state independently (";" not "&&") so one bad
        # site doesn't skip the rest, and continue-on-error keeps the run flowing
        # to reviews/prices/deploy — the directory is a slow-changing trust list,
        # not worth blocking the whole refresh. Per-scraper failures are logged to
        # the Issues DB.
        continue-on-error: true
        run: npm run scrape:dmv

      - name: Scrape Trustpilot ratings → Notion Schools
        run: npm run scrape:reviews

      - name: Scrape school prices → Notion
        # The scraper exits non-zero when prices are quarantined (Needs Review)
        # or a systemic failure is detected, so this step is visibly red instead
        # of silently succeeding over bad data. continue-on-error keeps the deploy
        # flowing — quarantined prices are never written, just awaiting review.
        continue-on-error: true
        run: npm run scrape:prices

      - name: Enrich new schools via Google Places API
        # Dry run unless --apply. Accepts a Places match only when its address (or,
        # with no street address, its name) proves it is the school; writes no Notes.
        run: npm run enrich:places -- --apply

      - name: Trigger Vercel redeploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Vercel redeploy triggered"
          else
            echo "No deploy hook configured — skipping"
          fi

      # Directory health (25 Nov 2026). The scrape step above runs with
      # continue-on-error, which for months hid broken state scrapers behind a
      # green run (Virginia's list unwritten since 1 May). The report flags any
      # state that failed this run or hasn't been refreshed in 35 days, keeps one
      # self-maintaining GitHub issue, and turns the run red so GitHub emails.
      - name: Directory health report
        id: dirhealth
        if: ${{ always() }}
        continue-on-error: true
        run: npx tsx scripts/report-directory-health.ts --out directory-health.md

      - name: Notify — open/close "Directory health" issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f directory-health.md ]; then echo "no report (step did not finish) — skipping"; exit 0; fi
          gh label create directory-health --color D93F0B --description "Official school lists need attention" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --label directory-health --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.dirhealth.outcome }}" = "success" ]; then
            if [ -n "$NUM" ]; then gh issue close "$NUM" --comment "✅ Every state list refreshed this run. Auto-closed."; fi
            exit 0
          fi
          TITLE="🗂️ Official school lists need attention"
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body-file directory-health.md
          else
            gh issue create --title "$TITLE" --body-file directory-health.md --label directory-health >/dev/null
          fi

      - name: Fail the run if a state list is broken or stale
        if: ${{ always() && steps.dirhealth.outcome == 'failure' }}
        run: |
          echo "::error::Directory health check flagged states — see the 'Official school lists need attention' issue."
          exit 1
