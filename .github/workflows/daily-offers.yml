name: Daily Offer Refresh

# Light daily pass: only the monetizable price pages (~15 school×state targets),
# to catch live promos before they expire (Aceable/iDriveSafely countdowns run in
# hours, not weeks). The heavy pass — DMV directories + reviews + regular-price
# re-verify — stays monthly in monthly-update.yml. This is what turns the site
# from a price list into a deal tracker.
on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC
  workflow_dispatch:
    inputs:
      report:
        description: "Report only — scrape + log, make ZERO Notion writes"
        type: boolean
        default: false

jobs:
  offers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # notifier step opens/closes the "Prices to review" issue
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SCHOOLS_DB: ${{ secrets.NOTION_SCHOOLS_DB }}
      NOTION_PRICING_DB: ${{ secrets.NOTION_PRICING_DB }}
      NOTION_SCRAPER_RULES_DB: ${{ secrets.NOTION_SCRAPER_RULES_DB }}
      NOTION_ISSUES_DB: ${{ secrets.NOTION_ISSUES_DB }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Scrape current prices + live offers → Notion
        # continue-on-error: a quarantined price (Needs Review) or one flaky target
        # site must not block the publish. Live prices are never clobbered (WS1), and
        # Active Offer / Sale Price are only set or cleared for targets we actually
        # scraped this run — a blocked/dead fetch leaves an existing offer intact.
        continue-on-error: true
        run: npm run scrape:prices ${{ (github.event.inputs.report == 'true') && '-- --report' || '' }}

      - name: Publish (fresh prices + offers → site)
        if: ${{ github.event.inputs.report != 'true' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Vercel redeploy triggered"
          else
            echo "No deploy hook configured — skipping"
          fi

      # Turn the scrape-review.json artifact into ONE self-maintaining GitHub issue.
      # It mirrors the current run: non-empty review[] opens/updates the issue,
      # empty auto-closes it. Runs even if the scrape step tripped continue-on-error.
      - name: Notify — open/close "Prices to review" issue
        if: ${{ always() && github.event.inputs.report != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE=scrape-review.json
          if [ ! -f "$FILE" ]; then echo "no review artifact (scrape did not finish) — skipping"; exit 0; fi
          gh label create price-review --color FBCA04 --description "Daily price scrape needs a human" --force >/dev/null 2>&1 || true
          COUNT=$(jq '.review | length' "$FILE")
          NUM=$(gh issue list --label price-review --state open --json number --jq '.[0].number // empty')
          if [ "$COUNT" -eq 0 ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "✅ All price targets back in band ($(jq -r .date "$FILE")). Auto-closed by the daily run."
              echo "closed #$NUM"
            else
              echo "clean — nothing open"
            fi
            exit 0
          fi
          BODY=$(jq -r '
            "The daily price scrape found **\(.review | length)** target(s) whose live price disagrees with the Scraper Rules DB. Live prices were left untouched.\n\n"
            + (.review | map("- **\(.label)** — scraped $\(.proposed // "—") vs verified $\(.anchor // "—"): \(.reason)") | join("\n"))
            + "\n\n---\n**To clear a line:** open its row in the **Scraper Rules DB** and either (a) update **Verified Price** + Expected Min/Max to the real new price, or (b) tick **Price Locked** if the verified price still stands (offers keep updating; the band check stops). Do **not** just close this issue — if the mismatch remains, the next run reopens it.\n\n_Regenerated daily at 13:00 UTC. Last run: \(.date)._"
          ' "$FILE")
          TITLE="🔎 Prices to review ($COUNT)"
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body "$BODY"
            gh issue reopen "$NUM" >/dev/null 2>&1 || true
            echo "updated #$NUM"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label price-review >/dev/null
            echo "created"
          fi
