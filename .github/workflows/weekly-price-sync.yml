name: Weekly Price Sync

# Weekly refresh of the non-payer schools' per-state prices. Tier-2 brands that
# aren't daily payers but still need accurate cards. Currently the JSON-LD schools
# (Improv), read from their published Course/Offer structured data via plain fetch
# (no browser). A price outside the sane band (junk in the JSON-LD) is flagged as a
# self-closing issue, never written. Publishes via the deploy hook when anything changed.

on:
  schedule:
    - cron: "0 16 * * 0" # Sundays 16:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SCHOOLS_DB: ${{ secrets.NOTION_SCHOOLS_DB }}
      NOTION_PRICING_DB: ${{ secrets.NOTION_PRICING_DB }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci

      - name: Sync JSON-LD prices
        continue-on-error: true
        run: npx tsx scripts/sync-jsonld-prices.ts --write --ci

      - name: Publish (trigger rebuild) if anything changed
        if: always()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -f jsonld-price-sync.json ] || { echo "no summary — skip"; exit 0; }
          changed=$(jq -r '(.created // 0) + (.updated // 0)' jsonld-price-sync.json)
          if [ "${changed:-0}" -gt 0 ] && [ -n "${VERCEL_DEPLOY_HOOK:-}" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null && echo "triggered rebuild ($changed rows changed)"
          else
            echo "no change (${changed:-0}) or no hook — skip rebuild"
          fi

      - name: Open/close the price-attention issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f jsonld-price-sync.json ] || echo '{"needsAttention":true,"flagged":["sync did not run"],"created":0,"updated":0}' > jsonld-price-sync.json
          need=$(jq -r 'if .needsAttention then 1 else 0 end' jsonld-price-sync.json)
          gh label create weekly-price-drift --color B60205 --description "Weekly price sync needs a human decision" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --label weekly-price-drift --state open --json number --jq '.[0].number // empty')
          if [ "$need" -eq 0 ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "✅ Weekly prices synced cleanly ($(date -u +%Y-%m-%d)). Auto-closed."
              echo "closed #$NUM"
            else
              echo "clean — nothing open"
            fi
            exit 0
          fi
          BODY=$(jq -rn --slurpfile s jsonld-price-sync.json '
            "The weekly price sync skipped some states (price outside the sane band — likely junk in the JSON-LD).\n\n"
            + "**Flagged (NOT written):**\n" + ($s[0].flagged|map("- "+.)|join("\n"))
            + "\n\n---\nCheck the page; if a real price, widen that school'"'"'s band in `scripts/sync-jsonld-prices.ts`. Auto-closes when the next run is clean."
          ')
          TITLE="💲 Weekly price sync needs attention"
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body "$BODY"
            gh issue reopen "$NUM" >/dev/null 2>&1 || true
            echo "updated #$NUM"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label weekly-price-drift >/dev/null
            echo "created"
          fi
